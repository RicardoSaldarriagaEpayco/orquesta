[project]
name = "orquesta"
version = "0.0.0"
description = "Núcleo para gobernar agentes de IA de ingeniería: registro, políticas, auditoría, gateway de modelos y evals."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==2.3.0",
    "cryptography==50.0.2",
    "jsonschema==4.26.0",
    "langgraph==1.2.19",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.2",
    "pyyaml==6.0.3",
]

[project.scripts]
orquesta = "orquesta.cli:main"
orquesta-egress = "orquesta.sandbox.egress:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S603", "S607"]
"src/orquesta/workspace.py" = ["S603", "S607"]
"src/orquesta/identity.py" = ["S603", "S607"]
"src/orquesta/policy/load.py" = ["S506", "S603", "S607"]
"src/orquesta/audit/chain.py" = ["S608"]
"src/orquesta/gateway/openai_compatible.py" = ["S310"]
"src/orquesta/evidence/receipt.py" = ["S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
